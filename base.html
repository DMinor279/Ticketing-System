<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; }
        .sidebar { height: 100vh; background-color: #2c3e50; color: white; padding: 20px; }
        .sidebar a { color: white; display: block; padding: 10px; text-decoration: none; }
        .sidebar a:hover { background-color: #34495e; }
        .status-Applied { background-color: #007bff; color: white; padding: 5px 10px; border-radius: 5px; }
        .status-Interview { background-color: #2ecc71; color: white; padding: 5px 10px; border-radius: 5px; }
        .status-Rejected { background-color: #e74c3c; color: white; padding: 5px 10px; border-radius: 5px; }
        .status-Completed { background-color: #2ecc71; color: white; padding: 5px 10px; border-radius: 5px; }
        .status-Scheduled { background-color: #f39c12; color: white; padding: 5px 10px; border-radius: 5px; }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar">
        <h3>Logo</h3>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('applications_page') }}">Applications</a>
        <a href="{{ url_for('tickets_page') }}">Tickets</a>
        <a href="{{ url_for('profile_page') }}">Profile</a>
        <a href="{{ url_for('settings_page') }}">Settings</a>
        <a href="/logout">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="p-4 flex-grow-1">
        {% block content %}
        <!-- Page-specific content goes here -->
        {% endblock %}
    </div>
</div>
</body>
</html>
