<!-- templates/new_activity.html -->
{% extends "base.html" %}

{% block title %}Add New Activity{% endblock %}

{% block content %}
<h2>Add New Activity</h2>
<form action="{{ url_for('add_activity') }}" method="POST">
    <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" name="date" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="activity" class="form-label">Activity</label>
        <input type="text" name="activity" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select name="status" class="form-select">
            <option value="Completed">Completed</option>
            <option value="Scheduled">Scheduled</option>
        </select>
    </div>
    <button type="submit" class="btn btn-success">Add Activity</button>
</form>
{% endblock %}
